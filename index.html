<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wuzerl</title>
<meta name="description" content="Schwangerschaft und Babyzeit organisieren. Alle Daten bleiben auf dem Gerät.">
<meta name="theme-color" content="#F2C640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wuzerl">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#1C2333; --muted:#5A6375; --line:#DFE3EA;
  --pass:#F2C640; --pass-deep:#D9A91A; --pass-ink:#2F2600;
  --mama:#B23F69; --mama-bg:#F8E4EC; --papa:#1C6F82; --papa-bg:#DDF0F4; --both:#5A6375; --both-bg:#E8EAEF;
  --ok:#2C7A57; --warn:#B4461A; --warn-bg:#FBE8DF;
  --display:"Avenir Next", "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --text:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151D; --surface:#1A2030; --sunk:#141924; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2A3245;
    --pass:#E5B935; --pass-deep:#C79A16; --pass-ink:#231B00;
    --mama:#EE93B4; --mama-bg:#3A1F2B; --papa:#6CC3D5; --papa-bg:#173540; --both:#AEB6C6; --both-bg:#262D3D;
    --ok:#6CCB9C; --warn:#F2A27C; --warn-bg:#3A2219;
  }
}
:root[data-theme="dark"]{
  --bg:#11151D; --surface:#1A2030; --sunk:#141924; --ink:#E7EAF1; --muted:#9AA3B6; --line:#2A3245;
  --pass:#E5B935; --pass-deep:#C79A16; --pass-ink:#231B00;
  --mama:#EE93B4; --mama-bg:#3A1F2B; --papa:#6CC3D5; --papa-bg:#173540; --both:#AEB6C6; --both-bg:#262D3D;
  --ok:#6CCB9C; --warn:#F2A27C; --warn-bg:#3A2219;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pass-deep);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700;margin:28px 0 10px}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.top .brand{font-family:var(--display);font-weight:800;font-size:1.15rem}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

/* hero: the yellow booklet */
.hero{position:relative;background:var(--pass);color:var(--pass-ink);border-radius:22px 22px 8px 8px;padding:20px 22px 22px 34px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--pass-deep)}
.hero::after{content:"";position:absolute;left:20px;top:14px;bottom:14px;border-left:2px dashed color-mix(in srgb,var(--pass-ink) 30%,transparent)}
.hero .kicker{font-weight:700;font-size:.95rem}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,112px);line-height:.9;letter-spacing:-.04em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.32em;letter-spacing:0;font-weight:700;margin-left:.2em}
.hero .sub{font-size:1rem}
.bar{position:relative;height:8px;border-radius:8px;background:color-mix(in srgb,var(--pass-ink) 15%,transparent);margin-top:16px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--pass-ink)}
.bar-legend{display:flex;justify-content:space-between;font-size:.78rem;margin-top:6px;opacity:.8}

/* cards and rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card + .card{margin-top:10px}
.note{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.875rem;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .title{font-weight:700;line-height:1.3}
.row .meta{font-size:.85rem;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.row.done .title{text-decoration:line-through;color:var(--muted);font-weight:400}
.row.over .when{color:var(--warn);font-weight:700}
.row.ms{background:color-mix(in srgb,var(--pass) 14%,var(--surface))}
.info{font-size:.9rem;color:var(--muted);margin-top:8px;line-height:1.5}
.linkish{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:.85rem}

.check{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:1px;padding:0}
.check svg{width:16px;height:16px;opacity:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.on svg{opacity:1}
.dot{flex:none;width:28px;height:28px;display:grid;place-items:center}
.dot::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--pass-deep);transform:rotate(45deg)}

.who{border:0;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;line-height:1.6}
.who.M{background:var(--mama-bg);color:var(--mama)}
.who.P{background:var(--papa-bg);color:var(--papa)}
.who.B{background:var(--both-bg);color:var(--both)}
.tag{font-size:.8rem}

/* segmented + chips */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* forms */
label.f{display:block;margin-top:12px;font-size:.9rem;font-weight:700}
label.f span{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.block{width:100%;margin-top:14px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;gap:10px;align-items:center;margin-top:12px}
.toggle input{width:22px;height:22px}

/* tracker */
.track{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 12px;text-align:left;min-height:84px}
.tbtn b{display:block;font-family:var(--display);font-size:1.1rem}
.tbtn span{font-size:.82rem;color:var(--muted)}
.tbtn.sleep-on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbtn.sleep-on span{color:inherit;opacity:.8}
.tbtn.hint{border-color:var(--pass-deep);box-shadow:inset 0 0 0 1px var(--pass-deep)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1}
.stats span{font-size:.78rem;color:var(--muted)}
.day{font-weight:700;margin:18px 0 6px;font-size:.95rem}
.time{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px}
.del{border:0;background:none;color:var(--muted);font-size:.85rem;padding:2px 4px}
.del.arm{color:var(--warn);font-weight:700}

.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:var(--ok)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 10px;font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"] svg{color:var(--pass-deep)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{padding:18px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* sub views and new parts */
.back{border:0;background:none;padding:4px 0;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.navrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:10px}
.navrow .main{flex:1}
.navrow .title{font-weight:700}
.navrow .chev{color:var(--muted);font-size:1.3rem}
.navrow.live{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navrow.live .muted,.navrow.live .chev{color:inherit;opacity:.8}
.bigbtn{width:100%;border:0;border-radius:24px;padding:34px 16px;font-family:var(--display);font-weight:800;font-size:1.7rem;background:var(--pass);color:var(--pass-ink)}
.bigbtn.on{background:var(--ink);color:var(--bg)}
.bigbtn small{display:block;font-family:var(--text);font-weight:400;font-size:.95rem;margin-top:4px}
a.tel{color:inherit;font-weight:700;text-decoration:none;border-bottom:2px solid var(--pass-deep)}
.vote{display:flex;gap:6px;flex-wrap:wrap}
.vote button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem}
.vote button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.match{color:var(--ok);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--text);fill:var(--muted)}
.photo{width:100%;border-radius:12px;margin-top:8px;display:block}
.filebtn{display:inline-block;border-radius:12px;padding:10px 14px;background:var(--sunk);font-weight:700;cursor:pointer;margin-top:10px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.ro-badge{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted" style="padding:40px 0">Lädt …</p></div>
<nav class="tabs" id="nav"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const DAY=864e5;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pd=s=>{if(!s||typeof s!=='string')return null;const[y,m,d]=s.split('-').map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const diff=(a,b)=>Math.round((a-b)/DAY);
const fmt=d=>d.toLocaleDateString('de-AT',{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined});
const fmtLong=d=>d.toLocaleDateString('de-AT',{weekday:'short',day:'numeric',month:'long'});
const hm=ms=>new Date(ms).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
const dur=ms=>{const m=Math.max(0,Math.round(ms/60000));const h=Math.floor(m/60);return h?h+' Std '+(m%60)+' Min':m+' Min'};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const M=x=>Math.round(x*30.44);
const w=n=>(n-1)*7, we=n=>n*7-1;
const val=(v,ks)=>typeof v==='function'?v(ks):v;
const num=s=>{const n=Number(String(s||'').replace(',','.'));return isFinite(n)?n:0};

/* ---------- store: nur auf diesem Gerät (IndexedDB) ---------- */
const APP_VERSION='1.0.0';
const LK='unserbaby:v1',ME='unserbaby:me',KURZ='unserbaby:kurz',SYNC='unserbaby:sync';
const COLLS=['meta','checks','logs','pass','appts','contr','names','contacts','diary'];
const blank=()=>Object.fromEntries(COLLS.map(c=>[c,{}]));
const S={dl:null,ro:false,kurz:false,loading:true,d:blank(),
  ui:{tab:'heute',filter:'alle',list:'klinikMama',open:{},offset:0,ml:90,passKind:'Untersuchung',passSeg:'eintraege',babySeg:'alltag',newWho:'B',arm:null,showVacc:false,showOld:false,apptForm:false,photo:null,chart:'gewicht'}};
let me='M';
try{me=localStorage.getItem(ME)||'M';S.kurz=localStorage.getItem(KURZ)==='1'}catch(e){}
const IDB={h:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('unser-baby',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async db(){return this.h||(this.h=await this.open())},
  async get(k){const db=await this.db();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.db();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}};
let useIdb=typeof indexedDB!=='undefined';
const fill=o=>COLLS.forEach(c=>S.d[c]=(o&&o[c]&&typeof o[c]==='object')?o[c]:{});
async function load(){
  try{
    if(!useIdb)throw 0;
    const d=await IDB.get('data');
    if(d)fill(d);
    else{try{const r=localStorage.getItem(LK);if(r){fill(JSON.parse(r));await saveNow();localStorage.removeItem(LK)}}catch(e){}}
  }catch(e){useIdb=false;try{const r=localStorage.getItem(LK);if(r)fill(JSON.parse(r))}catch(x){}}
  S.loading=false;render();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
async function saveNow(){
  try{if(useIdb)await IDB.set('data',S.d);else localStorage.setItem(LK,JSON.stringify(S.d))}
  catch(e){toast('Speichern auf diesem Gerät hat nicht geklappt. Ist der Speicher voll?')}
}
let chain=Promise.resolve();function save(){chain=chain.then(saveNow)}
function put(c,id,obj){const o={...obj};delete o._del;o._u=Date.now();S.d[c]={...S.d[c],[id]:o};render();save()}
function del(c,id){if(!S.d[c][id])return;S.d[c]={...S.d[c],[id]:{_del:true,_u:Date.now()}};render();save()}
const live=(c,id)=>{const x=S.d[c][id];return x&&!x._del?x:null};
const meta=id=>live('meta',id)||{};
const putMeta=(id,patch)=>put('meta',id,{...meta(id),...patch});
const arr=c=>Object.entries(S.d[c]).filter(([,v])=>v&&!v._del).map(([id,v])=>({id,...v}));
const hasData=()=>COLLS.some(c=>arr(c).length);

/* ---------- Abgleich per Datei ---------- */
const syncInfo=()=>{try{return JSON.parse(localStorage.getItem(SYNC)||'{}')}catch(e){return {}}};
const markSync=k=>{try{const o=syncInfo();o[k]=Date.now();localStorage.setItem(SYNC,JSON.stringify(o))}catch(e){}};
const ago=ts=>{if(!ts)return 'noch nie';const d=diff(today(),new Date(new Date(ts).setHours(0,0,0,0)));return d===0?'heute, '+hm(ts):d===1?'gestern':'vor '+d+' Tagen'};
async function saveFile(name,blob,title){
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title});return 'ok'}}
  catch(e){if(e&&e.name==='AbortError')return 'abort'}
  if(S.dl){try{await S.dl.save({filename:name,data:blob});return 'ok'}catch(e){if(e&&e.code==='declined')return 'abort'}}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'ok'}
  catch(e){return 'fail'}
}
async function shareData(){
  const json=JSON.stringify({app:'wuzerl',version:1,appVersion:APP_VERSION,exported:Date.now(),from:me,data:S.d});
  const r=await saveFile('wuzerl-'+iso(today())+'.json',new Blob([json],{type:'application/json'}),'Wuzerl');
  if(r==='ok'){markSync('out');render();toast('Daten geteilt. Jetzt am anderen Handy importieren.')}
  else if(r==='abort')toast('Abgebrochen.');else toast('Teilen hat auf diesem Gerät nicht geklappt.');
}
function mergeData(inc){
  let n=0;
  COLLS.forEach(c=>{const src=inc[c];if(!src||typeof src!=='object'||Array.isArray(src))return;const cur={...S.d[c]};
    Object.entries(src).forEach(([id,doc])=>{if(!doc||typeof doc!=='object'||Array.isArray(doc)||id.length>80)return;const l=cur[id];
      if(!l||(Number(doc._u)||0)>(Number(l._u)||0)){cur[id]=doc;n++}});
    S.d[c]=cur});
  return n;
}
async function importFile(file){
  if(file.size>40e6)return toast('Diese Datei ist zu groß.');
  let o;try{o=JSON.parse(await file.text())}catch(e){return toast('Das ist keine gültige Datei aus dieser App.')}
  if(!o||(o.app!=='wuzerl'&&o.app!=='unser-baby')||!o.data||typeof o.data!=='object')return toast('Das ist keine Datei aus dieser App.');
  const n=mergeData(o.data);await saveNow();markSync('in');render();
  toast(n?n+' Einträge übernommen.':'Alles war schon auf dem neuesten Stand.');
}

let tt;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),2800)}

/* ---------- settings & status ---------- */
const set=()=>meta('settings');
const nameOf=k=>k==='M'?(set().nameM||'Mama'):k==='P'?(set().nameP||'Papa'):'Beide';
const nextWho=k=>k==='M'?'P':k==='P'?'B':'M';
const whoBtn=(k,act,id)=>`<button class="who ${k}" data-a="${act}" data-id="${esc(id)}" aria-label="Zuständig: ${esc(nameOf(k))}, tippen zum Wechseln">${esc(nameOf(k))}</button>`;
const check=(on,act,id)=>`<button class="check ${on?'on':''}" data-a="${act}" data-id="${esc(id)}" aria-label="${on?'Als offen markieren':'Als erledigt markieren'}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button>`;

function status(){
  const s=set(),et=pd(s.et),birth=pd(s.birth),t=today();
  if(birth)return {phase:'baby',days:diff(t,birth),birth,et};
  if(et){const lmp=addD(et,-280),g=diff(t,lmp);return {phase:'preg',g,wk:Math.floor(g/7),dy:((g%7)+7)%7,left:diff(et,t),et,lmp}}
  return {phase:'none'};
}
function babyAge(birth){
  const t=today();let m=(t.getFullYear()-birth.getFullYear())*12+(t.getMonth()-birth.getMonth());if(t.getDate()<birth.getDate())m--;
  const days=diff(t,birth);
  if(days<0)return {big:'0',unit:'Tage',sub:'Geburtsdatum liegt in der Zukunft'};
  if(days<14)return {big:String(days),unit:days===1?'Tag':'Tage',sub:'alt'};
  if(m<3)return {big:String(Math.floor(days/7)),unit:'Wochen',sub:(days%7)+' Tage dazu'};
  if(m<24){const a=new Date(birth);a.setMonth(a.getMonth()+m);return {big:String(m),unit:'Monate',sub:diff(t,a)+' Tage dazu'}}
  return {big:String(Math.floor(m/12)),unit:'Jahre',sub:(m%12)+' Monate dazu'};
}

function tasks(){
  const s=set(),et=pd(s.et),br=pd(s.birth),birth=br||et,lmp=et?addD(et,-280):null,ks=!!s.ks;
  return DEFS.map(d=>{
    const base=d.b==='lmp'?lmp:d.b==='et'?et:birth;if(!base)return null;
    const st=live('checks','t_'+d.id)||{};
    return {...d,kind:'task',start:addD(base,val(d.s,ks)),end:addD(base,val(d.e,ks)),done:!!st.done,who:st.who||d.w||'B',est:d.b==='birth'&&!br};
  }).filter(Boolean).sort((a,b)=>a.start-b.start||a.end-b.end);
}
function appts(){
  return arr('appts').filter(a=>pd(a.date)).map(a=>({...a,kind:'appt',start:pd(a.date),end:pd(a.date),who:a.who||'B',done:!!a.done})).sort((a,b)=>a.start-b.start||(a.time||'').localeCompare(b.time||''));
}
function groupTasks(list){
  const t=today(),born=!!pd(set().birth),g={over:[],now:[],soon:[],later:[],done:[],old:[]};
  list.forEach(x=>{
    if(born&&x.p==='preg'){if(!x.ms&&!x.done)g.old.push(x);return}
    if(x.ms){if(x.end>=t&&diff(x.start,t)<=60)g.soon.push(x);else if(x.end>=t)g.later.push(x);return}
    if(x.kind==='appt'){if(x.end<t){if(diff(t,x.end)<=60)g.done.push(x);return} if(diff(x.start,t)<=7)return g.now.push(x); if(diff(x.start,t)<=60)return g.soon.push(x); return g.later.push(x)}
    if(x.done)return g.done.push(x);
    if(x.end<t)return g.over.push(x);
    if(x.start<=t)return g.now.push(x);
    if(diff(x.start,t)<=60)return g.soon.push(x);
    g.later.push(x);
  });
  const by=(a,b)=>a.start-b.start||(a.time||'').localeCompare(b.time||'');
  Object.values(g).forEach(a=>a.sort(by));
  return g;
}
function whenText(x){
  const t=today();
  if(x.kind==='appt'){const d=diff(x.start,t);const rel=d===0?'Heute':d===1?'Morgen':fmtLong(x.start);return rel+(x.time?', '+x.time+' Uhr':'')}
  if(x.ms)return fmt(x.start)+(x.est?' (geschätzt)':'');
  let s=diff(x.end,x.start)===0?fmt(x.start):fmt(x.start)+' bis '+fmt(x.end);
  if(!x.done){
    if(x.end<t)s='überfällig seit '+fmt(x.end);
    else if(x.start<=t){const l=diff(x.end,t);s+=l===0?', heute letzter Tag':', noch '+l+(l===1?' Tag':' Tage')}
  }
  return s+(x.est?' (geschätzt)':'');
}
function taskRow(x){
  const t=today(),over=x.kind==='task'&&!x.done&&!x.ms&&x.end<t,open=S.ui.open[x.id];
  if(x.kind==='appt'){
    return `<div class="row ${x.end<t?'done':''}"><span class="dot" aria-hidden="true" style="opacity:.0"></span><div class="main">
      <div class="title">${esc(x.title)}</div>
      <div class="meta"><span class="when" style="color:var(--ink);font-weight:700">${esc(whenText(x))}</span>${whoBtn(x.who,'appt-who',x.id)}${x.place?`<span>${esc(x.place)}</span>`:''}${delBtn('appt-del',x.id)}</div>
      ${x.note?`<p class="info">${esc(x.note)}</p>`:''}</div></div>`;
  }
  const lead=x.ms?'<span class="dot" aria-hidden="true"></span>':check(x.done,'task-done',x.id);
  return `<div class="row ${x.done?'done':''} ${over?'over':''} ${x.ms?'ms':''}">${lead}<div class="main">
    <div class="title">${esc(x.t)}</div>
    <div class="meta"><span class="when">${esc(whenText(x))}</span>${x.ms?'':whoBtn(x.who,'task-who',x.id)}<span class="tag">${esc(x.tag)}</span></div>
    ${x.i?(open?`<p class="info">${esc(x.i)}</p><button class="linkish" data-a="task-info" data-id="${x.id}">Weniger</button>`:`<button class="linkish" data-a="task-info" data-id="${x.id}">Mehr dazu</button>`):''}
  </div></div>`;
}

/* ---------- calendar export (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function fold(l){const out=[];while(l.length>70){out.push(l.slice(0,70));l=' '+l.slice(70)}out.push(l);return out.join('\r\n')}
const ds=d=>iso(d).replace(/-/g,'');
function buildIcs(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wuzerl//DE','CALSCALE:GREGORIAN','X-WR-CALNAME:Wuzerl'];
  const ev=(id,o)=>{L.push('BEGIN:VEVENT','UID:'+id+'@wuzerl','DTSTAMP:'+stamp);
    if(o.time){L.push('DTSTART:'+o.start+'T'+o.time.replace(':','')+'00','DTEND:'+o.endTs)}else{L.push('DTSTART;VALUE=DATE:'+o.start,'DTEND;VALUE=DATE:'+o.end)}
    L.push(fold('SUMMARY:'+icsEsc(o.title)));if(o.desc)L.push(fold('DESCRIPTION:'+icsEsc(o.desc)));if(o.loc)L.push(fold('LOCATION:'+icsEsc(o.loc)));
    if(o.alarm)L.push('BEGIN:VALARM','ACTION:DISPLAY',fold('DESCRIPTION:'+icsEsc(o.title)),'TRIGGER:'+o.alarm,'END:VALARM');
    L.push('END:VEVENT')};
  const t=today(),born=!!pd(set().birth);let n=0;
  tasks().forEach(x=>{
    if(x.done||x.end<t||(born&&x.p==='preg'))return;
    const range=diff(x.end,x.start)>0;
    const st0=x.start<t?t:x.start;ev('s-'+x.id,{start:ds(st0),end:ds(addD(st0,1)),title:(x.ms?'':(range?'Ab jetzt: ':''))+x.t,desc:(range?'Zeitraum: '+fmt(x.start)+' bis '+fmt(x.end)+'\n':'')+(x.i||'')+(x.est?' Datum geschätzt.':''),alarm:x.ms?null:'PT9H'});n++;
    if(range&&['Arbeit','Geld','Behörde'].includes(x.tag)){ev('e-'+x.id,{start:ds(x.end),end:ds(addD(x.end,1)),title:'Frist: '+x.t,desc:x.i||'',alarm:'-P1DT15H'});n++}
  });
  appts().forEach(a=>{
    if(a.end<t)return;
    let o={start:ds(a.start),end:ds(addD(a.start,1)),title:a.title,desc:a.note,loc:a.place,alarm:'-P1DT15H'};
    if(/^\d\d:\d\d$/.test(a.time||'')){const [h,m]=a.time.split(':').map(Number);const e=new Date(a.start);e.setHours(h+1,m);o.time=a.time;o.endTs=ds(e)+'T'+String(e.getHours()).padStart(2,'0')+String(e.getMinutes()).padStart(2,'0')+'00';o.alarm='-PT2H'}
    ev('a-'+a.id,o);n++;
  });
  L.push('END:VCALENDAR');return {text:L.join('\r\n')+'\r\n',n};
}

/* ---------- hero ---------- */
function hero(){
  const st=status();
  if(st.phase==='preg'){
    const pct=Math.max(0,Math.min(100,st.g/280*100));
    const left=st.left>0?`Noch ${st.left} Tage bis zum ${fmt(st.et)}`:st.left===0?'Heute ist der errechnete Termin':`${-st.left} Tage über dem Termin`;
    return `<section class="hero" aria-label="Schwangerschaftswoche"><p class="kicker">${esc(nameOf('M'))} ist in der Schwangerschaftswoche</p>
    <p class="big">${st.wk}+${st.dy}<small>SSW</small></p><p class="sub">${esc(left)}</p>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><div class="bar-legend"><span>Beginn</span><span>20. Woche</span><span>Termin</span></div></section>`;
  }
  if(st.phase==='baby'){
    const a=babyAge(st.birth),n=set().nameBaby;
    return `<section class="hero" aria-label="Alter des Babys"><p class="kicker">${n?esc(n)+' ist':'Unser Baby ist'}</p>
    <p class="big">${a.big}<small>${a.unit}</small></p><p class="sub">${esc(a.sub)}, geboren am ${fmtLong(st.birth)}</p></section>`;
  }
  if(S.ro)return `<section class="hero"><p class="big" style="font-size:clamp(40px,12vw,64px)">Wuzerl</p><p class="sub">Hier ist noch nichts eingetragen.</p></section>`;
  return `<section class="hero"><p class="kicker">Willkommen bei</p><p class="big" style="font-size:clamp(40px,12vw,64px)">Wuzerl</p>
  <p class="sub">Tragt den errechneten Geburtstermin ein. Daraus berechnet die App alle Termine und Fristen.</p>
  <div class="inline" style="margin-top:14px"><input type="date" id="setupEt" aria-label="Errechneter Geburtstermin"><button class="btn" data-a="setup-et">Speichern</button></div></section>`;
}

/* ---------- Heute ---------- */
function viewHeute(){
  const st=status();let h=hero();
  if(st.phase==='none')return h+navrow('tab','kontakte','Wichtige Nummern','Notruf, Hebamme, Kinderärztin');
  const contrOn=!!meta('state').contrStart;
  if(st.phase==='preg'&&(st.wk>=34||contrOn||arr('contr').length))h+=navrow('tab','wehen','Wehen-Timer',contrOn?'Wehe läuft seit '+mmss(Date.now()-meta('state').contrStart):'Dauer und Abstände messen',contrOn);
  const g=groupTasks(tasks().concat(appts())),next=g.over.concat(g.now,g.soon).slice(0,5);
  h+=`<h2>Als Nächstes</h2>`;
  if(g.over.length)h+=`<p class="small" style="color:var(--warn);margin:-4px 0 8px">${g.over.length} ${g.over.length===1?'Punkt ist':'Punkte sind'} überfällig</p>`;
  h+=next.length?`<div class="list">${next.map(taskRow).join('')}</div>`:`<div class="card empty">Gerade ist nichts fällig.</div>`;
  h+=`<p style="margin-top:8px"><button class="linkish" data-a="tab" data-id="termine">Alle Termine ansehen</button></p>`;
  if(st.phase==='baby'||logs().length)h+=`<h2>Baby heute</h2>`+trackerSummary();
  h+=navrow('tab','kontakte','Wichtige Nummern','Notruf, Hebamme, Kinderärztin');
  const out=syncInfo().out;
  if(hasData()&&(!out||Date.now()-out>3*DAY))h+=navrow('tab','settings','Mit dem anderen Handy abgleichen','Zuletzt geteilt: '+ago(out));
  return h;
}

/* ---------- Wehen-Timer ---------- */
function viewWehen(){
  const on=meta('state').contrStart,list=arr('contr').filter(c=>c.start&&c.end).sort((a,b)=>b.start-a.start);
  const hour=list.filter(c=>c.start>Date.now()-36e5);
  const gaps=[];for(let i=0;i<list.length-1&&i<6;i++)gaps.push(list[i].start-list[i+1].start);
  const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:0;
  const recent=list.slice(0,6),avgDur=recent.length?recent.reduce((a,c)=>a+(c.end-c.start),0)/recent.length:0;
  let h=backBtn('heute')+`<h1 style="font-size:1.8rem;margin:6px 0 12px">Wehen-Timer</h1>`;
  h+=S.ro?'':`<button class="bigbtn ${on?'on':''}" data-a="contr">${on?'Wehe vorbei':'Wehe beginnt'}<small>${on?'läuft seit '+mmss(Date.now()-on):'zum Starten antippen'}</small></button>`;
  h+=`<div class="card" style="margin-top:12px"><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${hour.length}</b><span>in der letzten Stunde</span></div><div><b>${avgGap?mmss(avgGap):'–'}</b><span>Ø Abstand</span></div><div><b>${avgDur?mmss(avgDur):'–'}</b><span>Ø Dauer</span></div></div></div>`;
  h+=`<p class="note" style="margin-top:10px">Wann ihr ins Spital fahren sollt, besprecht vorher mit Hebamme oder Spital. Bei Blasensprung, Blutung, starken Schmerzen oder wenn sich das Baby weniger bewegt, sofort im Kreißsaal anrufen. Im Notfall 144.</p>`;
  if(!list.length)return h;
  h+=`<h2>Gemessen</h2><div class="list">`+list.slice(0,30).map((c,i)=>{const prev=list[i+1];return `<div class="row"><span class="time">${hm(c.start)}</span><div class="main"><div class="title">Dauer ${mmss(c.end-c.start)}</div><div class="meta">${prev?`<span>Abstand ${mmss(c.start-prev.start)}</span>`:'<span>erste Messung</span>'}${delBtn('contr-del',c.id)}</div></div></div>`}).join('')+`</div>`;
  if(!S.ro)h+=`<p style="margin-top:10px">${delBtn('contr-clear','all').replace('Löschen','Alle Messungen löschen')}</p>`;
  return h;
}

/* ---------- Baby: Alltag + Gesundheit ---------- */
function trackerSummary(){
  const L=logs(),t0=today().getTime(),T=L.filter(x=>x.at>=t0);
  const feeds=T.filter(x=>x.type==='stillen_l'||x.type==='stillen_r').length;
  const ml=T.filter(x=>x.type==='flasche').reduce((a,x)=>a+(Number(x.ml)||0),0);
  const diapers=T.filter(x=>x.type==='nass'||x.type==='voll').length;
  const sleep=T.filter(x=>x.type==='schlaf'&&x.end).reduce((a,x)=>a+(x.end-x.at),0);
  const lastFeed=L.find(x=>['stillen_l','stillen_r','flasche'].includes(x.type));
  const st=meta('state'),lastMed=L.find(x=>x.type==='medi');
  let h=`<div class="card"><div class="stats"><div><b>${feeds}</b><span>Stillen</span></div><div><b>${ml}</b><span>ml Flasche</span></div><div><b>${diapers}</b><span>Windeln</span></div><div><b>${(sleep/36e5).toFixed(1).replace('.',',')}</b><span>Std Schlaf</span></div></div>`;
  if(lastFeed)h+=`<p class="small muted" style="margin-top:10px">Letzte Mahlzeit vor ${dur(Date.now()-lastFeed.at)} (${esc(LT[lastFeed.type])}${lastFeed.ml?', '+lastFeed.ml+' ml':''})</p>`;
  if(st.sleepStart)h+=`<p class="small" style="margin-top:4px;font-weight:700">Schläft seit ${hm(st.sleepStart)}</p>`;
  if(lastMed&&Date.now()-lastMed.at<24*36e5)h+=`<p class="small muted" style="margin-top:4px">Letztes Medikament: ${esc(lastMed.med||'')} ${esc(lastMed.dose||'')} vor ${dur(Date.now()-lastMed.at)}</p>`;
  return h+`</div>`;
}
function logList(L){
  if(!L.length)return '';
  let h='',cur='';const t0=today();
  L.slice(0,60).forEach(x=>{
    const d=new Date(x.at),day=iso(d);
    if(day!==cur){if(cur)h+='</div>';cur=day;const dd=diff(t0,pd(day));h+=`<p class="day">${dd===0?'Heute':dd===1?'Gestern':fmtLong(d)}</p><div class="list">`}
    const extra=x.type==='flasche'?(x.ml||0)+' ml':x.type==='schlaf'?(x.end?'bis '+hm(x.end)+', '+dur(x.end-x.at):''):x.type==='fieber'?String(x.temp||'').replace('.',',')+' °C':x.type==='medi'?[x.med,x.dose].filter(Boolean).join(', '):'';
    h+=`<div class="row"><span class="time">${hm(x.at)}</span><div class="main"><div class="title">${esc(LT[x.type]||x.type)}</div><div class="meta">${extra?`<span>${esc(extra)}</span>`:''}<span>${esc(nameOf(x.by||'B'))}</span>${delBtn('log-del',x.id)}</div>${x.note?`<p class="info">${esc(x.note)}</p>`:''}</div></div>`;
  });
  return h+'</div>';
}

function growthPoints(field){
  const s=set(),birth=pd(s.birth),pts=[];
  if(birth){const bv=field==='weight'?num(s.birthWeight):num(s.birthLength);if(bv)pts.push({d:0,v:bv,label:'Geburt'})}
  arr('pass').filter(e=>e.for!=='mama'&&pd(e.date)&&num(e[field])>0).forEach(e=>{const d=birth?diff(pd(e.date),birth):0;pts.push({d,v:num(e[field]),date:e.date})});
  return pts.filter(p=>p.d>=0).sort((a,b)=>a.d-b.d);
}
function viewWachstum(){
  const birth=pd(set().birth);
  let h=seg('chart',S.ui.chart,[['gewicht','Gewicht'],['groesse','Größe']],'Kurve');
  if(!birth)return h+`<div class="card empty">Die Kurve startet, sobald das Geburtsdatum in den Einstellungen eingetragen ist.</div>`;
  const isW=S.ui.chart==='gewicht',pts=growthPoints(isW?'weight':'height').map(p=>({...p,v:isW?p.v/1000:p.v}));
  if(pts.length<2)return h+`<div class="card empty">Für eine Kurve braucht es mindestens zwei Werte. Tragt Gewicht und Größe bei Untersuchungen im Bereich Einträge ein, das Geburtsgewicht in den Einstellungen.</div>`;
  const W=340,H=220,pl=40,pr=12,pt=12,pb=30;
  const maxD=Math.max(...pts.map(p=>p.d),7),minV=Math.min(...pts.map(p=>p.v)),maxV=Math.max(...pts.map(p=>p.v));
  const lo=Math.floor((minV-(maxV-minV)*.1)*(isW?2:0.2))/(isW?2:0.2),hi=Math.ceil((maxV+(maxV-minV)*.1+(isW?.1:1))*(isW?2:0.2))/(isW?2:0.2);
  const x=d=>pl+(W-pl-pr)*d/maxD,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const ticks=4,yt=[...Array(ticks+1)].map((_,i)=>lo+(hi-lo)*i/ticks);
  const unitX=maxD>120?'Monate':'Wochen',xd=maxD>120?30.44:7,xt=[...Array(5)].map((_,i)=>maxD*i/4);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${isW?'Gewichtskurve':'Größenkurve'}">`;
  yt.forEach(v=>{svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(isW?v.toFixed(1):Math.round(v)).toString().replace('.',',')}</text>`});
  xt.forEach(d=>{svg+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle">${Math.round(d/xd)}</text>`});
  svg+=`<polyline fill="none" stroke="var(--pass-deep)" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>x(p.d)+','+y(p.v)).join(' ')}"/>`;
  pts.forEach(p=>{svg+=`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="4.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>`});
  svg+=`</svg>`;
  const last=pts[pts.length-1];
  h+=`<div class="card">${svg}<p class="small muted" style="text-align:center">${isW?'Gewicht in kg':'Größe in cm'} nach Alter in ${unitX}</p></div>`;
  h+=`<p class="small muted" style="margin-top:8px">Zuletzt ${(isW?last.v.toFixed(2):last.v).toString().replace('.',',')} ${isW?'kg':'cm'}${last.date?' (gemessen '+fmt(pd(last.date))+')':''}. Ob die Entwicklung passt, beurteilt die Kinderärztin anhand der Perzentilen im Pass.</p>`;
  return h;
}

function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let max=1100,q=.78;const go=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',q);if(u.length>190000&&max>320){max=Math.round(max*.8);q=Math.max(.55,q-.05);return go()}res(u)};go()};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

let pending=false;

  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!['checkbox','file'].includes(a.type)&&document.getElementById('app').contains(a)){pending=true;return}
  pending=false;
  const kurz=S.ro||S.kurz,tab=S.ui.tab;
  const views={termine:viewTermine,listen:viewListen,baby:viewBaby,pass:viewPass,settings:viewSettings,wehen:viewWehen,kontakte:viewKontakte};
  const body=S.loading?'<p class="muted" style="padding:40px 0">Lädt …</p>':kurz?viewKurz():(views[tab]||viewHeute)();
  const name=set().nameBaby?esc(set().nameBaby):'Wuzerl';
  document.getElementById('app').innerHTML=`<header class="top"><span class="brand">${name}${S.ro?' <span class="ro-badge">Nur ansehen</span>':''}</span>${kurz?'':`<button class="iconbtn" data-a="tab" data-id="settings" aria-label="Einstellungen">${ICON.gear}</button>`}</header>`+body;
  const nav=document.getElementById('nav');
  if(kurz){nav.innerHTML='';nav.style.display='none'}else{nav.style.display='';const cur=PARENT[tab]||tab;nav.innerHTML='<div class="in">'+TABS.map(([k,l])=>`<button data-a="tab" data-id="${k}" ${k===cur?'aria-current="page"':''}>${ICON[k]}<span>${l}</span></button>`).join('')+'</div>'}

 'vacc':()=>{S.ui.showVacc=true;render()},
 'me':id=>{me=id;try{localStorage.setItem(ME,id)}catch(e){}render()},
 'share':()=>shareData(),
 'wipe':()=>{if(S.ui.arm==='wipeall'){S.ui.arm=null;S.d=blank();saveNow();render();toast('Alle Daten auf diesem Handy wurden gelöscht.')}else{S.ui.arm='wipeall';render()}},
 'kurz-off':()=>{S.kurz=false;try{localStorage.setItem(KURZ,'0')}catch(e){}render()},
 'save-settings':()=>{const et=v('sEt'),birth=v('sBirth');const o={...set(),et:pd(et)?et:'',birth:pd(birth)?birth:'',ks:document.getElementById('sKs').checked,nameM:v('sM'),nameP:v('sP'),nameBaby:v('sB'),birthWeight:v('sBw'),birthLength:v('sBl').replace(',','.')};blur();put('meta','settings',o);toast('Einstellungen gespeichert.')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.id)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='newItem'){e.preventDefault();A['item-add']()}if(e.target.id==='newName'){e.preventDefault();A['name-add']()}});
setInterval(()=>{const t=S.ui.tab;if(t==='wehen'&&meta('state').contrStart)render()},1000);
setInterval(()=>{if(['baby','heute'].includes(S.ui.tab)||S.kurz||S.ro)render()},60000);

/* ---------- start ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.claude){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
render();
load();
if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{if(d){S.dl=d;render()}}).catch(()=>{});
})();
</script>
</body>
</html>
